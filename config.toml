# FPL Hog Statistician — FPL-style colours in both light and dark mode
# (users can switch in the app's ⋮ menu → Settings → Theme)
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#963CFF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F0F7"
textColor = "#1F1A2E"

[theme.dark]
primaryColor = "#00FF87"
backgroundColor = "#11131A"
secondaryBackgroundColor = "#1D2030"
textColor = "#EDEAF4"

[client]
toolbarMode = "minimal"

[global]
disableWidgetStateDuplicationWarning = true
